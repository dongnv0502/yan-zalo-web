name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yan-zalo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build --tag yan-zalo-web:ci .
      - name: Smoke-test the container
        run: |
          set -euo pipefail
          trap 'docker logs yan-zalo-ci; docker rm -f yan-zalo-ci >/dev/null' EXIT
          docker run -d --name yan-zalo-ci -p 127.0.0.1:3300:3000 yan-zalo-web:ci
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3300/api/auth/status | jq -e '.status == "idle"'

  publish:
    needs: check
    if: github.repository == 'dongnv0502/yan-zalo-web' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dongnv0502/yan-zalo-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/dongnv0502/yan-zalo-web
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.HOMELAB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the homelab GitOps repository
        uses: actions/checkout@v5
        with:
          repository: dongnv0502/homelab
          ref: main
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}
      - name: Bump only the YAN Zalo image digest
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          file=k8s/apps/yan-zalo-web/deployment.yaml
          image=ghcr.io/dongnv0502/yan-zalo-web
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          pattern="^([[:space:]]+image: ${image//./\\.})@sha256:[a-f0-9]{64}$"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            current=$(git ls-remote https://github.com/dongnv0502/yan-zalo-web.git refs/heads/main | cut -f1)
            if [[ "$current" != "$GITHUB_SHA" ]]; then
              echo 'Skipping an older source revision.'
              exit 0
            fi
            git fetch --depth 1 origin main
            git checkout --detach FETCH_HEAD
            if [[ "$(grep -Ec "$pattern" "$file")" != 1 ]]; then
              echo 'Homelab must first be configured for the digest-pinned YAN Zalo image.' >&2
              exit 1
            fi
            # Keep the manifest's own indentation; only the digest changes.
            sed -i -E "s#${pattern}#\\1@${IMAGE_DIGEST}#" "$file"
            if git diff --quiet -- "$file"; then
              exit 0
            fi
            git diff --check -- "$file"
            git commit -m "deploy(yan-zalo-web): ${GITHUB_SHA::12}" -- "$file"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying without overwriting other changes." >&2
          done
          exit 1
